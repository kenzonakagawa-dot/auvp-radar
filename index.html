<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AUVP RADAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
/* Site do RADAR - estrutura nova aprovada em 22/10/2026. Paleta e fontes AUVP (Indica); icone do site antigo, a pedido da equipe. */
:root{
  --verde:#023619; --verde2:#011F0E; --amarelo:#EFBE4F;
  --branco:#FFFFFF; --chumbo:#1B1B1B; --cinza:#6B6B6B; --cinza-claro:#9A9A9A;
  --fundo:#F4F4F4; --borda:#E6E6E6; --cab:#F7F7F7;
  --ok:#1E7B45; --ok-f:#E3EFE7; --alerta:#8A5A00; --alerta-f:#FFF3D6; --info:#1F5FC9; --info-f:#E8F0FD; --ruim:#C0262D; --ruim-f:#FDECEC;
  --f-titulo:Sora,"Segoe UI",Arial,sans-serif; --f-corpo:Roboto,-apple-system,"Segoe UI",Arial,sans-serif;
  --raio:14px; --sombra:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--chumbo);font:400 15px/1.55 var(--f-corpo);-webkit-font-smoothing:antialiased}
a{color:var(--verde)}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* estrutura */
.topo{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--branco);border-bottom:1px solid var(--borda)}
.marca{display:flex;align-items:center;gap:10px;font:700 16px var(--f-titulo);color:var(--verde);text-decoration:none}
.marca .logo{width:28px;height:28px;color:var(--verde);flex:none}
.topo .quando{margin-left:auto;font-size:13px;color:var(--cinza)}
.prot{font:600 11px var(--f-titulo);letter-spacing:.06em;text-transform:uppercase;background:var(--amarelo);color:var(--verde2);padding:3px 8px;border-radius:99px}
.casca{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 60px)}
.menu{position:sticky;top:60px;height:calc(100vh - 60px);padding:20px 12px;background:var(--branco);border-right:1px solid var(--borda);display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--chumbo);text-decoration:none;font-weight:500}
.menu a:hover{background:var(--cab)}
.menu a[aria-current]{background:var(--verde);color:var(--branco)}
.menu a svg{width:20px;height:20px;flex:none}
.menu .cont{margin-left:auto;font:600 12px var(--f-titulo);background:var(--amarelo);color:var(--verde2);border-radius:99px;padding:1px 8px}
.menu .rodape{margin-top:auto;border-top:1px solid var(--borda);padding-top:10px}
.menu .rodape a{color:var(--cinza);font-size:14px}
main{padding:32px 40px 64px;max-width:1120px;width:100%;min-width:0}
h1{font:700 28px/1.2 var(--f-titulo);margin:0 0 6px;color:var(--verde2)}
.lead{color:var(--cinza);margin:0 0 24px;max-width:70ch}
h2{font:600 18px var(--f-titulo);margin:36px 0 4px;color:var(--verde2)}
h2+.lead{margin-bottom:14px}

/* abas */
.abas{display:flex;gap:6px;margin:0 0 24px;border-bottom:1px solid var(--borda);overflow-x:auto}
.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;margin-right:18px;color:var(--cinza);font-weight:500;white-space:nowrap}
.abas button[aria-selected=true]{color:var(--verde);border-bottom-color:var(--verde)}

/* pecas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:8px}
.kpi{background:var(--branco);border-radius:var(--raio);padding:18px 20px;box-shadow:var(--sombra)}
.kpi .k{font:600 11px var(--f-titulo);letter-spacing:.07em;text-transform:uppercase;color:var(--cinza)}
.kpi .v{font:700 30px/1.15 var(--f-titulo);color:var(--verde2);margin-top:8px}
.kpi .v small{font-size:15px;color:var(--cinza);font-weight:600}
.kpi .n{font-size:13px;color:var(--cinza);margin-top:4px}
.card{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);padding:20px}
.lista{display:grid;gap:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-titulo);letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-f);color:var(--ok)} .p-alerta{background:var(--alerta-f);color:var(--alerta)} .p-info{background:var(--info-f);color:var(--info)} .p-ruim{background:var(--ruim-f);color:var(--ruim)} .p-neutro{background:var(--cab);color:var(--cinza);border:1px solid var(--borda)}
.tag{font-size:12px;color:var(--cinza);border:1px solid var(--borda);border-radius:99px;padding:2px 9px;white-space:nowrap}
.mut{color:var(--cinza)}
.conclusao{font:600 16px/1.4 var(--f-titulo);color:var(--verde2);margin:0 0 12px}
.ajuda{border:0;background:none;color:var(--cinza);font-size:13px;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
.explica{display:none;font-size:13px;color:var(--cinza);background:var(--cab);border-radius:10px;padding:10px 14px;margin:8px 0 0}
.explica.aberto{display:block}

/* pauta */
.pauta{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px}
.pauta.com-img{grid-template-columns:44px minmax(0,1fr) 176px}
.pauta .mini{grid-column:3;grid-row:1;width:176px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--cab)}
.pauta.com-img details{grid-column:2 / 4}
.pauta .num{font:700 22px var(--f-titulo);color:var(--amarelo);background:var(--verde);width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.pauta h3{margin:0;font:600 17px/1.35 var(--f-titulo)}
.pauta .ang{margin:6px 0 0;color:#333}
.pauta .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pauta details{grid-column:2;margin-top:6px;font-size:14px}
.pauta summary{color:var(--verde);cursor:pointer;font-weight:500}
.pauta details p{margin:8px 0 0}
.fontes{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;margin-top:8px}

/* video */
.vid{display:grid;grid-template-columns:28px 128px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--borda);text-decoration:none;color:inherit}
.vid:first-child{border-top:0}
.vid:hover .tit{text-decoration:underline}
.vid .pos{font:700 16px var(--f-titulo);color:var(--verde);text-align:center}
.vid img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--cab)}
.vid .tit{font-weight:500;line-height:1.35}
.vid .linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:13px;color:var(--cinza)}
.vid .num{text-align:right;white-space:nowrap}
.vid .num strong{display:block;font:700 16px var(--f-titulo)}
.vid .num span{font-size:12px;color:var(--cinza)}
.sem-pos{grid-template-columns:128px 1fr auto}

/* quente */
.quente .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.quente h3{margin:0 8px 0 0;font:600 17px var(--f-titulo)}

/* tabela */
.tabela{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px var(--f-titulo);letter-spacing:.06em;text-transform:uppercase;color:var(--cinza);text-align:left;background:var(--cab);padding:10px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--borda);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.nosso td{background:#F3F8F5;font-weight:600}
.barra{height:8px;border-radius:99px;background:var(--cab);overflow:hidden;min-width:80px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px}
.dupla{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:1180px){.dupla{grid-template-columns:minmax(0,1fr)}}
.vazio{color:var(--cinza);text-align:center;padding:28px}
.aviso{background:var(--alerta-f);color:var(--alerta);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:20px}

.acoes{display:flex;justify-content:center;margin-top:16px}
.botao{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:11px 22px;background:var(--verde);color:var(--branco);font:600 14px var(--f-titulo);text-decoration:none}
.botao.sec{background:var(--branco);color:var(--verde);border:1px solid var(--verde)}
.botao:hover{filter:brightness(1.15)}
.todas li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--borda);list-style:none}
.todas li:first-child{border-top:0}
.todas ul{margin:0;padding:0}
.todas a.t{font-weight:500;color:var(--chumbo);text-decoration:none}
.todas a.t:hover{text-decoration:underline}
.todas .f{font-size:13px;color:var(--cinza);white-space:nowrap}
.busca{width:100%;max-width:420px;padding:11px 14px;border:1px solid var(--borda);border-radius:10px;font:inherit;background:var(--branco);margin-bottom:16px}

/* tela de canais e seletor no topo */
.canal-chip{display:inline-flex;align-items:center;gap:8px;margin-left:12px;padding:5px 12px 5px 5px;border:1px solid var(--borda);border-radius:99px;text-decoration:none;color:var(--chumbo);font-weight:500;font-size:14px;max-width:260px}
.canal-chip:hover{background:var(--cab)}
.canal-chip img{width:26px;height:26px;border-radius:50%}
.canal-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.canal-chip b{color:var(--cinza);font-weight:400;font-size:12px}
.seletor{position:relative;margin-left:12px}
.seletor .canal-chip{margin-left:0;background:var(--branco);cursor:pointer;font:inherit;font-weight:500;font-size:14px}
.opcoes{position:absolute;top:calc(100% + 6px);left:0;z-index:50;min-width:280px;margin:0;padding:6px;list-style:none;background:var(--branco);border:1px solid var(--borda);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12)}
.opcoes button{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:10px;background:none;text-align:left;color:var(--chumbo)}
.opcoes button:hover{background:var(--cab)}
.opcoes li[aria-selected=true] button{background:var(--ok-f)}
.opcoes img{width:34px;height:34px;border-radius:50%;flex:none}
.opcoes span{display:flex;flex-direction:column;flex:1;min-width:0}
.opcoes strong{font-weight:600;font-size:14px}
.opcoes small{font-size:12px;color:var(--cinza)}
.opcoes i{font-style:normal;color:var(--verde);font-weight:700}
/* tela de inicio em pagina inteira */
body.tela-inicio{background:var(--branco)}
body.tela-inicio .topo,body.tela-inicio .menu{display:none}
body.tela-inicio .casca{display:block;min-height:100vh}
body.tela-inicio main{max-width:none;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:40px 20px}
body.tela-inicio .inicio{text-align:center}
body.tela-inicio .inicio .lead{margin-left:auto;margin-right:auto}
body.tela-inicio .canal{box-shadow:none;border:1px solid var(--borda)}
body.tela-inicio .canal:hover{border-color:var(--verde);box-shadow:var(--sombra)}
.marca-inicio{display:inline-flex;align-items:center;gap:10px;font:700 18px var(--f-titulo);color:var(--verde);margin-bottom:28px}
.marca-inicio .logo{width:36px;height:36px;color:var(--verde)}
.inicio{max-width:960px;width:100%}
.canais{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.canal{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px solid transparent;cursor:pointer;padding:24px 18px}
.canal:hover{border-color:var(--verde)}
.canal.atual{border-color:var(--verde)}
.canal img,.canal .sem-foto{width:84px;height:84px;border-radius:50%;background:var(--cab)}
.canal .nome{font:600 17px var(--f-titulo);color:var(--verde2)}
.canal .nums{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--cinza)}
.canal .nums strong{color:var(--chumbo)}

/* calendario do historico */
.cal{max-width:420px}
.cal .cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal .cab strong{font:600 16px var(--f-titulo)}
.cal .cab button{border:1px solid var(--borda);background:var(--branco);border-radius:8px;width:34px;height:34px}
.cal .cab button:disabled{opacity:.35;cursor:default}
.cal .grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .sem{font:600 11px var(--f-titulo);color:var(--cinza);padding:4px 0}
.cal .dia{height:40px;border-radius:10px;border:0;background:none;color:var(--cinza-claro);font-weight:500}
.cal .dia.tem{background:var(--ok-f);color:var(--verde);font-weight:700}
.cal .dia.tem:hover{outline:2px solid var(--verde)}
.cal .dia[aria-pressed=true]{background:var(--verde);color:var(--branco)}
.cal .dia:disabled{cursor:default}
.hist{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.hist .cal{position:sticky;top:84px}
@media (max-width:1200px){.hist{grid-template-columns:1fr}.hist .cal{position:static}}

/* celular */
@media (max-width:860px){
  .casca{grid-template-columns:1fr}
  .menu{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--borda);z-index:40;justify-content:space-around}
  .menu a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  .menu a span.rot{display:block}
  .menu .cont{position:absolute;margin:0 0 0 18px;font-size:10px}
  .menu .rodape{margin:0;border:0;padding:0}
  main{padding:20px 16px 96px}
  h1{font-size:23px}
  .vid{grid-template-columns:22px 96px 1fr}
  .vid img{width:96px}
  .vid .num{grid-column:3;text-align:left}
  .vid.sem-pos{grid-template-columns:96px 1fr}
  .vid.sem-pos .num{grid-column:2}
  .vid .num strong{display:inline;font-size:14px;margin-right:6px}
  .dupla{grid-template-columns:1fr}
  .pauta.com-img{grid-template-columns:44px 1fr}
  .pauta .mini{grid-column:1 / 3;grid-row:auto;order:-1;width:100%;aspect-ratio:2.4/1}
  .pauta.com-img details{grid-column:2}
  .topo .quando span{display:none}
  .topo .quando{display:none}
  .seletor{margin-left:auto}
  .canal-chip{max-width:190px}
  .opcoes{left:auto;right:0;min-width:260px}
  td:first-child{white-space:nowrap}
  .topo{padding:0 16px}
  .marca{white-space:nowrap}
  .topo .quando{font-size:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:24px}
  .menu .rodape a{font-size:11px;color:var(--chumbo)}
}
</style>
</head>
<body>
<header class="topo">
  <a class="marca" href="#hoje"><svg class="logo" aria-hidden="true" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="currentColor"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="4.5"/><path d="M16 16l6.5-6.5"/></g></svg>AUVP RADAR</a>
  <div class="seletor" id="seletor" hidden>
    <button class="canal-chip" id="canal-chip" aria-haspopup="listbox" aria-expanded="false" aria-label="Trocar de canal"></button>
    <ul class="opcoes" id="opcoes" role="listbox" hidden></ul>
  </div>
  <span class="quando"><span>Atualizado em </span><strong id="quando">-</strong></span>
</header>
<div class="casca">
  <nav class="menu" aria-label="Menu principal" id="menu"></nav>
  <main id="conteudo" tabindex="-1"><p class="vazio">Carregando…</p></main>
</div>
<script>
'use strict';
// ---------------------------------------------------------------- utilidades
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtCurto = n => n == null ? '–' : new Intl.NumberFormat('pt-BR', {notation:'compact', maximumFractionDigits: Math.abs(n) >= 1e6 ? 1 : 0}).format(n);
const fmtNum = n => n == null ? '–' : new Intl.NumberFormat('pt-BR').format(n);
const fmtDec = n => n == null ? '–' : new Intl.NumberFormat('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}).format(n);
// data sem hora ('2026-09-08') e lida como meia-noite UTC e cai no dia anterior no Brasil: meio-dia evita
const paraData = s => new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(s)) ? s + 'T12:00:00' : String(s).replace(' ', 'T'));
const fmtData = s => { if (!s) return '–'; const d = paraData(s); return isNaN(d) ? esc(s) : d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}); };
const fmtDataHora = s => { if (!s) return '–'; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? esc(s) : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); };
const linkSeguro = u => /^https?:\/\/[^\s"<>]+$/.test(String(u || '')) ? u : null;
const mediana = xs => { const s = xs.filter(x => x != null).sort((a, b) => a - b); if (!s.length) return null; const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const ICONES = {
  hoje: '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>',
  concorrentes: '<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>',
  nosso: '<path d="M22 8.5c0-2-1.5-3.5-3.5-3.5h-13C3.5 5 2 6.5 2 8.5v7C2 17.5 3.5 19 5.5 19h13c2 0 3.5-1.5 3.5-3.5z"/><path d="M10 9l5 3-5 3z"/>',
  validar: '<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  historico: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  sistema: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[k]}</svg>`;
const RESULTADO = {alcance:['Alcance','p-info'], autoridade:['Autoridade','p-ok'], 'os dois':['Alcance + autoridade','p-alerta'], conversao:['Venda','p-alerta']};
const GRUPO = {concorrente:['Concorrente','p-info'], dark:['Canal dark','p-alerta'], internacional:['Internacional','p-ok'], nosso:['Nosso canal','p-ok']};
const SITE_ANTIGO = 'antigo/';

let D = null;
const rotFam = (f, grupo) => { if (!f) return null; if (f === 'economia' && grupo === 'internacional') return 'Economia no bolso'; return (D.familias && D.familias[f]) || f; };

// ---------------------------------------------------------------- pecas reutilizaveis
const kpi = (k, v, n) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}</div>`;
const pill = (txt, cls) => `<span class="pill ${cls}">${esc(txt)}</span>`;
const explica = (id, txt) => `<button class="ajuda" aria-expanded="false" data-explica="${id}">Como ler</button><p class="explica" id="${id}">${txt}</p>`;
function cartaoVideo(v, pos) {
  const g = GRUPO[v.grupo]; const fam = rotFam(v.familia, v.grupo);
  return `<a class="vid ${pos ? '' : 'sem-pos'}" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener noreferrer">
    ${pos ? `<span class="pos">${pos}</span>` : ''}
    <img src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/mqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">
    <span><span class="tit">${esc(v.titulo)}</span>
      <span class="linha"><strong style="color:var(--chumbo);font-weight:500">${esc(v.canal)}</strong>${g ? pill(g[0], g[1]) : ''}${fam ? `<span class="tag">${esc(fam)}</span>` : ''}${v.short ? '<span class="tag">short</span>' : ''}<span>${fmtData(v.publicado)}</span></span></span>
    <span class="num"><strong>${fmtCurto(v.views)}</strong><span>views${v.por_dia ? ' · ' + fmtCurto(v.por_dia) + '/dia' : ''}</span></span>
  </a>`;
}
function cartaoPauta(p, i) {
  const r = RESULTADO[String(p.resultado || '').toLowerCase()];
  const links = (p.links || []).map(l => linkSeguro(l.link) ? `<a href="${esc(l.link)}" target="_blank" rel="noopener noreferrer">${esc(l.fonte)} ↗</a>` : '').join('');
  const img = linkSeguro(p.imagem) && /^https:/.test(p.imagem) ? `<img class="mini" src="${esc(p.imagem)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.pauta').classList.remove('com-img');this.remove()">` : '';
  return `<article class="card pauta${img ? ' com-img' : ''}">${img}
    <span class="num">${i}</span>
    <div><h3>${esc(p.tema)}</h3><p class="ang">${esc(p.angulo)}</p>
      <div class="meta">${r ? pill(r[0], r[1]) : ''}${p.formato ? `<span class="tag">${esc(p.formato)}</span>` : ''}</div>
      ${links ? `<div class="fontes"><span class="mut">Fonte:</span>${links}</div>` : ''}</div>
    <details><summary>Por que a IA escolheu</summary><p>${esc(p.porque)}</p>${p.risco ? `<p><strong>Risco:</strong> ${esc(p.risco)}</p>` : ''}</details>
  </article>`;
}
// lista de pautas: 10 a vista + reserva atras de 'Ver mais' (pedido de 23/10/2026) + atalho para Todas as noticias
function listaPautas(itens, comTodas) {
  const prim = itens.slice(0, 10), resto = itens.slice(10);
  return `<div class="lista">${prim.map((x, i) => cartaoPauta(x, i + 1)).join('')}</div>`
    + (resto.length ? `<div class="lista mais" hidden style="margin-top:12px">${resto.map((x, i) => cartaoPauta(x, i + 11)).join('')}</div><div class="acoes"><button class="botao" data-vermais>Ver mais ${resto.length} pautas</button></div>` : '')
    + (comTodas ? `<div class="acoes"><a class="botao sec" href="#todas">Ver todas as notícias da coleta →</a></div>` : '');
}
function cartaoQuente(q) {
  const selo = q.nos_ja_falamos ? pill('Nós já falamos', 'p-ok') : pill('Ainda não falamos', 'p-alerta');
  return `<article class="card quente"><div class="cab"><h3>${esc(q.assunto)}</h3>${pill(q.canais + ' canais', 'p-info')}${selo}<span class="mut" style="font-size:13px">${fmtCurto(q.views_somadas)} views somadas</span></div>
    <details${q.nos_ja_falamos ? '' : ' open'}><summary class="mut" style="cursor:pointer;font-size:14px">${(q.videos || []).length} vídeos</summary>${(q.videos || []).map(v => cartaoVideo(v)).join('')}</details></article>`;
}

// ---------------------------------------------------------------- paginas
const quentesNovos = () => ((D.concorrentes.quentes || {}).itens || []).filter(q => !q.nos_ja_falamos);
const placarBR = () => ((D.concorrentes.placar || {}).canais || []).filter(c => c.grupo !== 'internacional');

// ---------------------------------------------------------------- canal escolhido (tela de inicio, 26/10/2026)
// A escolha fica no navegador de quem usa (localStorage); sem escolha, o site abre na tela de canais.
const CHAVE_CANAL = 'radar-canal';
const lerCanal = () => { try { return localStorage.getItem(CHAVE_CANAL); } catch (e) { return null; } };
const gravarCanal = h => { try { localStorage.setItem(CHAVE_CANAL, h); } catch (e) { } };
const canal = () => (D.canais || []).find(c => c.handle === lerCanal()) || null;
// seletor do topo: botao com o canal atual; ao clicar, a lista dos canais desce logo abaixo (pedido de 26/10/2026)
function chip() {
  const caixa = document.getElementById('seletor'), el = document.getElementById('canal-chip'), lista = document.getElementById('opcoes'), c = canal();
  if (!c) { caixa.hidden = true; return; }
  caixa.hidden = false;
  el.innerHTML = `${c.avatar ? `<img src="${esc(c.avatar)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(c.nome)}</span><b aria-hidden="true">▾</b>`;
  lista.innerHTML = (D.canais || []).map(x => `<li role="option" aria-selected="${x.handle === c.handle}"><button data-trocar="${esc(x.handle)}">${x.avatar ? `<img src="${esc(x.avatar)}" alt="" referrerpolicy="no-referrer">` : ''}<span><strong>${esc(x.nome)}</strong><small>${fmtCurto(x.inscritos)} inscritos · ${fmtNum(x.videos)} vídeos</small></span>${x.handle === c.handle ? '<i aria-hidden="true">✓</i>' : ''}</button></li>`).join('');
  fecharSeletor();
}
function fecharSeletor() { document.getElementById('opcoes').hidden = true; document.getElementById('canal-chip').setAttribute('aria-expanded', 'false'); }
function abrirSeletor() { document.getElementById('opcoes').hidden = false; document.getElementById('canal-chip').setAttribute('aria-expanded', 'true'); }
// aviso para pagina que ainda nao existe para o canal escolhido
const soSardinha = (o_que) => `<div class="card"><p class="conclusao">${o_que} ainda é só do Investidor Sardinha.</p><p class="mut" style="margin:0">Para o ${esc(canal().nome)}, veja a <a href="#nosso/visao">visão geral do canal</a>. ${o_que === 'A lista de pautas do dia' ? 'Gerar pautas para este canal exige escrever a linha editorial dele — dá para fazer quando vocês quiserem.' : ''}</p></div>`;
function visaoCanal(c) {
  const ms = c.meses || [], max = Math.max(1, ...ms.map(m => m.mediana_longos || 0));
  const semanas = 90 / 7;
  return `<div class="kpis">
      ${kpi('Inscritos', fmtCurto(c.inscritos), `${fmtNum(c.videos)} vídeos desde ${fmtData(c.desde)}`)}
      ${kpi('Views típicas', fmtCurto(c.j90.mediana_longos), 'vídeo longo, últimos 90 dias')}
      ${kpi('Vídeos por semana', fmtDec((c.j90.longos + c.j90.shorts) / semanas), `${c.j90.longos} longos e ${c.j90.shorts} shorts em 90 dias`)}
      ${kpi('Views em 90 dias', fmtCurto(c.j90.views), 'soma dos vídeos publicados no período')}
    </div>
    <h2>Mês a mês</h2><p class="lead">Views típicas dos vídeos longos publicados em cada mês. ${explica('ex-mes', '“Views típicas” é a mediana: o vídeo do meio, nem o melhor nem o pior. Os meses recentes ainda estão juntando views, então tendem a aparecer mais baixos. Vídeos exclusivos para membros ficam fora da conta (o YouTube não informa as views deles).')}</p>
    <div class="card tabela"><table><thead><tr><th>Mês</th><th class="n">Longos</th><th class="n">Shorts</th><th>Views típicas</th></tr></thead><tbody>
    ${ms.map(m => { const [a, mm] = m.mes.split('-'); const rot = maiuscula(new Date(+a, +mm - 1, 15).toLocaleDateString('pt-BR', {month: 'short', year: '2-digit'}).replace('.', '')); return `<tr><td>${rot}</td><td class="n">${m.longos}</td><td class="n">${m.shorts}</td><td><div style="display:flex;gap:10px;align-items:center"><strong style="min-width:56px">${fmtCurto(m.mediana_longos)}</strong><div class="barra" style="flex:1;max-width:260px"><i style="width:${Math.round(100 * (m.mediana_longos || 0) / max)}%"></i></div></div></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="dupla" style="margin-top:28px">
      <div class="card"><p class="conclusao">Mais vistos dos últimos 90 dias</p>${(c.top90 || []).map((v, i) => cartaoVideo({...v, canal: c.nome}, i + 1)).join('') || '<p class="vazio">Sem vídeos no período.</p>'}</div>
      <div class="card"><p class="conclusao">Últimos publicados</p>${(c.ultimos || []).map(v => cartaoVideo({...v, canal: c.nome, grupo: v.membros ? null : undefined})).join('')}</div>
    </div>
    <p class="mut" style="font-size:13px;margin-top:16px">Base completa conferida com o YouTube: ${fmtNum(c.conferencia.linhas)} vídeos na base × ${fmtNum(c.conferencia.videos_na_origem)} informados pelo canal${c.conferencia.membros ? ` (inclui ${c.conferencia.membros} exclusivos para membros)` : ''}.</p>`;
}

      </div>

      <h2>Pautas do dia</h2>

      ${listaPautas(p.itens, true)}`;
  }},
  concorrentes: {rotulo: 'Concorrentes', icone: 'concorrentes', abas: {
    'em-alta': ['Em alta agora', () => {
      const rk = D.concorrentes.ranking || [], br = rk.filter(v => v.grupo !== 'internacional').sort((a, b) => b.views - a.views).slice(0, 10), int = rk.filter(v => v.grupo === 'internacional').sort((a, b) => b.views - a.views).slice(0, 10);
      const q = (D.concorrentes.quentes || {}).itens || [];
      return `<h2 style="margin-top:0">Assunto quente</h2><p class="lead">O mesmo assunto em 3 ou mais canais nos últimos 7 dias. ${explica('ex-q', 'A IA agrupa os vídeos pelo assunto; a contagem de canais é feita à parte, e um canal que posta 5 vídeos do mesmo tema conta uma vez só. A contagem tende a sair por baixo, nunca por cima.')}</p>
        <div class="lista">${q.length ? q.map(cartaoQuente).join('') : '<div class="card vazio">Nenhum assunto em 3+ canais nesta semana.</div>'}</div>
        <h2>Mais vistos da semana</h2><p class="lead">Até 3 vídeos por canal, publicados nos últimos 7 dias. Coleta de ${fmtDataHora(D.concorrentes.coletado_em)}.</p>
        <div class="dupla"><div class="card"><p class="conclusao">Brasil</p>${br.map((v, i) => cartaoVideo(v, i + 1)).join('')}</div><div class="card"><p class="conclusao">Internacional</p>${int.map((v, i) => cartaoVideo(v, i + 1)).join('')}</div></div>`;
    }],
    'placar': ['Placar', () => {
      const pl = D.concorrentes.placar || {canais: []};
      const linhas = grupo => pl.canais.filter(c => grupo === 'int' ? c.grupo === 'internacional' : c.grupo !== 'internacional').sort((a, b) => (b.mediana_views_90d || 0) - (a.mediana_views_90d || 0));
      const max = Math.max(...pl.canais.map(c => c.mediana_views_90d || 0));
      const tab = (lista) => `<div class="card tabela"><table><thead><tr><th>#</th><th>Canal</th><th>Views típicas</th><th class="n">Longos/sem</th><th class="n">Shorts/sem</th><th class="n">Inscritos</th><th>Fala mais de</th></tr></thead><tbody>
        ${lista.map((c, i) => { const g = GRUPO[c.grupo]; return `<tr class="${c.grupo === 'nosso' ? 'nosso' : ''}"><td class="n">${i + 1}</td><td>${esc(c.nome)}${c.grupo === 'nosso' ? ' ' + pill('Nós', 'p-ok') : ''}</td>
          <td><div style="display:flex;align-items:center;gap:10px"><strong style="min-width:56px">${fmtCurto(c.mediana_views_90d)}</strong><div class="barra" style="flex:1"><i style="width:${max ? Math.round(100 * (c.mediana_views_90d || 0) / max) : 0}%"></i></div></div></td>
          <td class="n">${fmtDec(c.longos_por_semana)}</td><td class="n">${fmtDec(c.shorts_por_semana)}</td><td class="n">${fmtCurto(c.inscritos)}</td>
          <td>${c.categoria_top ? `<span class="tag">${esc(rotFam(c.categoria_top, c.grupo))}</span>` : '<span class="mut">–</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
      return `<p class="lead">A mesma régua para todos os canais, sobre os últimos 90 dias. ${explica('ex-pl', '<strong>Views típicas</strong> é a mediana de views dos vídeos longos (mais de 3 min) com pelo menos 7 dias no ar — o vídeo do meio, nem o melhor nem o pior. Short fica de fora porque é outro jogo de views. O ganho de inscritos no mês entra quando houver 30 dias de anotação (por volta de 20/11).')}</p>
        <h2 style="margin-top:8px">Brasil</h2>${tab(linhas('br'))}<h2>Internacional</h2>${tab(linhas('int'))}`;
    }],
    'nos-x-eles': ['Nós × eles', () => {
      const br = placarBR(), nos = br.find(c => c.grupo === 'nosso'), outros = br.filter(c => c.grupo !== 'nosso');
      if (!nos) return '<div class="card vazio">Sem dados do nosso canal.</div>';
      const medidas = [['Views típicas', 'mediana_views_90d', fmtCurto], ['Vídeos longos por semana', 'longos_por_semana', fmtDec], ['Shorts por semana', 'shorts_por_semana', fmtDec], ['Inscritos', 'inscritos', fmtCurto], ['Ganho de inscritos no mês', 'inscritos_ganhos_mes', fmtCurto]];
      const linhas = medidas.map(([rot, k, f]) => { const vals = outros.map(c => c[k]).filter(x => x != null); const med = mediana(vals); const v = nos[k];
        if (v == null || med == null) return `<tr><td>${rot}</td><td colspan="3" class="mut">ainda sem dado — precisa de 30 dias de anotação (~20/11)</td></tr>`;
        const pos = 1 + vals.filter(x => x > v).length, raz = med ? v / med : null;
        return `<tr><td>${rot}</td><td class="n"><strong>${f(v)}</strong></td><td class="n">${f(med)}${raz != null ? ` <span class="mut">(${fmtDec(raz)}x)</span>` : ''}</td><td class="n">${pos}º de ${vals.length + 1}</td></tr>`; }).join('');
      const soma = {}; let tot = 0; outros.forEach(c => Object.entries(c.categorias || {}).forEach(([f, n]) => { soma[f] = (soma[f] || 0) + n; tot += n; }));
      const nosC = nos.categorias || {}; const totN = Object.values(nosC).reduce((a, b) => a + b, 0);
      const mix = [...new Set([...Object.keys(soma), ...Object.keys(nosC)])].map(f => ({f, pn: totN ? 100 * (nosC[f] || 0) / totN : 0, po: tot ? 100 * (soma[f] || 0) / tot : 0})).sort((a, b) => Math.abs(b.pn - b.po) - Math.abs(a.pn - a.po));
      const vMed = mediana(outros.map(c => c.mediana_views_90d)), posV = 1 + outros.filter(c => (c.mediana_views_90d || 0) > nos.mediana_views_90d).length;
      const maior = mix.find(m => m.pn - m.po >= 5), menor = mix.find(m => m.po - m.pn >= 5);
      // frase-conclusao calculada dos dados: texto fixo ficaria errado no dia em que o placar mudar

        <p class="mut" style="margin:0;font-size:14px">Comparação com os ${outros.length} concorrentes do Brasil. "Concorrente típico" é o canal do meio (a mediana), para um canal gigante não distorcer a régua.</p></div>
        <div class="card tabela"><table><thead><tr><th>Medida</th><th class="n">Nosso canal</th><th class="n">Concorrente típico</th><th class="n">Posição</th></tr></thead><tbody>${linhas}</tbody></table></div>
        <h2>De que assunto cada um fala</h2><p class="lead">${maior ? `Falamos mais de <strong>${esc(rotFam(maior.f))}</strong>` : ''}${maior && menor ? ' e menos de ' : ''}${menor ? `<strong>${esc(rotFam(menor.f))}</strong>` : ''} do que os concorrentes. <span class="mut">(${totN} vídeos nossos × ${tot} deles)</span></p>

      const fracos = (t.padroes || []).filter(p => p.fraca);
      const melhor = ps[0], pior = ps[ps.length - 1];
      return `<div class="card" style="margin-bottom:20px"><p class="conclusao">${melhor ? `Título com “${esc(melhor.rotulo.toLowerCase())}” rende ${fmtDec(melhor.efeito_views)}x os vídeos parecidos.` : ''} ${pior && pior.efeito_views < 1 ? `“${esc(pior.rotulo)}” rende ${fmtDec(pior.efeito_views)}x.` : ''}</p>
        <p class="mut" style="margin:0;font-size:14px">${fmtNum(t.videos)} vídeos analisados. ${explica('ex-t', 'Cada vídeo é comparado com os vizinhos da mesma duração publicados até 21 dias antes ou depois — não com o canal inteiro. 1,0x = rende igual aos parecidos; 1,8x = rende 80% a mais. Características com menos de 5 vídeos ficam de fora (amostra pequena engana).')}</p></div>
        <div class="card tabela"><table><thead><tr><th>Característica do título</th><th class="n">Vídeos</th><th>Views (vs. parecidos)</th><th>Exemplo</th></tr></thead><tbody>
        ${ps.map(p => { const w = Math.min(100, Math.round(50 * p.efeito_views)); const cor = p.efeito_views >= 1.1 ? 'var(--ok)' : p.efeito_views <= 0.9 ? 'var(--ruim)' : 'var(--cinza-claro)'; return `<tr><td>${esc(p.rotulo)}</td><td class="n">${p.n_com}</td><td><div style="display:flex;gap:10px;align-items:center"><strong style="min-width:42px;color:${cor}">${fmtDec(p.efeito_views)}x</strong><div class="barra" style="flex:1;max-width:180px"><i style="width:${w}%;background:${cor}"></i></div></div></td><td class="mut" style="font-size:13px;max-width:340px">${esc((p.exemplos || [])[0] || '')}</td></tr>`; }).join('')}
        </tbody></table></div>${fracos.length ? `<p class="mut" style="font-size:13px">Fora da tabela por amostra pequena: ${fracos.map(f => esc(f.rotulo)).join(' · ')}.</p>` : ''}`;
    }]
  }},
  todas: {rotulo: 'Todas as notícias', icone: 'hoje', oculta: true, desenhar() {
    return `<p style="margin:0 0 8px"><a href="#hoje">← Voltar para Hoje</a></p><h1>Todas as notícias</h1><p class="lead" id="todas-lead">Tudo o que o RADAR leu na coleta do dia, antes da IA escolher. Só título, fonte e link.</p><input class="busca" type="search" id="busca" placeholder="Filtrar por palavra…" aria-label="Filtrar notícias"><div class="card todas" id="todas-lista"><p class="vazio">Carregando…</p></div>`;
  }, depois() { todasNoticias(); }},
  historico: {rotulo: 'Histórico', icone: 'historico', desenhar() {
    return `<h1>Histórico</h1><p class="lead">As pautas que a IA escolheu em cada dia. Os dias em verde têm lista — clique para ver.</p><div class="hist"><div class="card cal" id="cal"><p class="vazio">Carregando…</p></div><div id="hist-dia"></div></div>`;
  }, depois(arg) { historico(arg); }},
  sistema: {rotulo: 'Sistema', icone: 'sistema', rodape: true, desenhar() {
    const c = D.sistema.coleta || {fontes: []}, ex = D.sistema.execucoes || [];
    const ruins = c.fontes.filter(f => !f.itens && !f.quieto), quietas = c.fontes.filter(f => !f.itens && f.quieto);
    const custo = ex.filter(e => e.usd != null && ex.length && e.modelo === ex[0].modelo).slice(0, 5);const mediaUsd = custo.length ? custo.reduce((a, e) => a + e.usd, 0) / custo.length : null;
    return `<h1>Sistema</h1><p class="lead">Saúde da coleta e quanto custa. Área técnica — quem usa o dia a dia não precisa olhar. A <a href="${SITE_ANTIGO}">versão anterior do painel</a> continua no ar, com as análises que ainda não vieram para cá.</p>
      <div class="kpis">${kpi('Fontes funcionando', `${c.fontes.length - ruins.length - quietas.length} <small>de ${c.fontes.length}</small>`, ruins.length ? `${ruins.length} com problema` : 'nenhuma com problema')}${kpi('Itens na última coleta', fmtNum(c.total), fmtDataHora(c.coletado_em))}${kpi('Custo por dia', mediaUsd != null ? 'US$ ' + mediaUsd.toFixed(2).replace('.', ',') : '–', custo.length ? `seleção de pautas · ${esc(custo[0].modelo)}` : '')}</div>
      ${ruins.length ? `<h2>Precisa de atenção</h2><div class="card">${ruins.map(f => `<p style="margin:4px 0">${pill('Sem itens', 'p-ruim')} ${esc(f.fonte)} <span class="mut">${esc(f.obs || '')}</span></p>`).join('')}</div>` : ''}
      <h2>Últimas execuções</h2><div class="card tabela"><table><thead><tr><th>Quando</th><th>Modelo</th><th class="n">Notícias lidas</th><th class="n">Tempo</th><th class="n">Custo</th></tr></thead><tbody>
      ${ex.map(e => `<tr><td>${fmtDataHora(e.quando)}</td><td>${esc(e.modelo)}</td><td class="n">${fmtNum(e.candidatos)}</td><td class="n">${Math.round(e.segundos || 0)}s</td><td class="n">${e.usd != null ? 'US$ ' + e.usd.toFixed(3).replace('.', ',') : '–'}</td></tr>`).join('')}</tbody></table></div>
      <h2>Fontes</h2><div class="card tabela"><table><thead><tr><th>Fonte</th><th class="n">Itens</th><th>Situação</th></tr></thead><tbody>
      ${c.fontes.map(f => `<tr><td>${esc(f.fonte)}</td><td class="n">${fmtNum(f.itens)}</td><td>${f.itens ? pill('OK', 'p-ok') : f.quieto ? pill('Sem novidade', 'p-neutro') : pill('Problema', 'p-ruim')}</td></tr>`).join('')}</tbody></table></div>`;
  }}
};

// ---------------------------------------------------------------- todas as noticias
let TD = null;
async function todasNoticias() {
  if (!TD) { try { TD = await (await fetch('todas.json', {cache: 'no-store'})).json(); } catch (e) { document.getElementById('todas-lista').innerHTML = '<p class="vazio">Não consegui carregar.</p>'; return; } }
  const lead = document.getElementById('todas-lead'); if (lead) lead.textContent = `${TD.itens.length} notícias lidas na coleta de ${fmtDataHora(TD.coletado_em)}, antes da IA escolher. Primeiro as que saíram em mais veículos.`;
  desenharTodas('');
}
function desenharTodas(filtro) {
  const el = document.getElementById('todas-lista'); if (!el || !TD) return;
  const f = filtro.trim().toLowerCase();
  const its = TD.itens.map((x, i) => ({...x, i})).filter(x => !f || String(x.titulo).toLowerCase().includes(f)).sort((a, b) => (b.repeticoes - a.repeticoes) || (a.i - b.i));
  el.innerHTML = its.length ? `<ul>${its.map(x => { const l = (x.links || [])[0]; const tit = l ? `<a class="t" href="${esc(l.link)}" target="_blank" rel="noopener noreferrer">${esc(x.titulo)} ↗</a>` : esc(x.titulo);
    return `<li><span style="flex:1">${tit}</span>${x.repeticoes > 1 ? pill(x.repeticoes + ' veículos', 'p-info') : ''}<span class="f">${esc(x.tipo === 'tendencia' ? 'Google Trends' : x.fonte)}</span></li>`; }).join('')}</ul>` : '<p class="vazio">Nenhuma notícia com essa palavra.</p>';
}
// ---------------------------------------------------------------- historico (calendario)
let H = null, mesCal = null;
const maiuscula = s => s.charAt(0).toUpperCase() + s.slice(1);
const chaveDia = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
async function historico(diaPedido) {
  if (!H) { try { H = await (await fetch('historico.json', {cache: 'no-store'})).json(); } catch (e) { document.getElementById('cal').innerHTML = '<p class="vazio">Não consegui carregar o histórico.</p>'; return; } }
  const dias = Object.keys(H).sort(); if (!dias.length) return;
  const dia = H[diaPedido] ? diaPedido : dias[dias.length - 1];
  const [a, m] = dia.split('-').map(Number);
  mesCal = new Date(a, m - 1, 1);
  desenharCal(dia, dias); desenharDia(dia);
}
function desenharCal(sel, dias) {
  const el = document.getElementById('cal'); if (!el) return;
  const ano = mesCal.getFullYear(), mes = mesCal.getMonth();
  const primeiro = new Date(ano, mes, 1), ultimo = new Date(ano, mes + 1, 0);
  const minMes = dias[0].slice(0, 7), maxMes = dias[dias.length - 1].slice(0, 7), atual = chaveDia(primeiro).slice(0, 7);
  let g = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(s => `<span class="sem">${s}</span>`).join('');
  for (let i = 0; i < (primeiro.getDay() + 6) % 7; i++) g += '<span></span>';
  for (let d = 1; d <= ultimo.getDate(); d++) {
    const k = chaveDia(new Date(ano, mes, d)), tem = !!H[k];
    g += `<button class="dia ${tem ? 'tem' : ''}" ${tem ? `data-dia="${k}" aria-pressed="${k === sel}" aria-label="${d}: ${H[k].itens.length} pautas"` : 'disabled'}>${d}</button>`;
  }
  el.innerHTML = `<div class="cab"><button data-mes="-1" aria-label="Mês anterior" ${atual <= minMes ? 'disabled' : ''}>‹</button><strong>${maiuscula(primeiro.toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}))}</strong><button data-mes="1" aria-label="Próximo mês" ${atual >= maxMes ? 'disabled' : ''}>›</button></div><div class="grade">${g}</div><p class="mut" style="font-size:13px;margin:12px 0 0">${dias.length} dias com lista, desde ${fmtData(dias[0])}.</p>`;
}
function desenharDia(k) {
  const el = document.getElementById('hist-dia'); if (!el) return; const d = H[k];
  const dt = new Date(k + 'T12:00:00');
  el.innerHTML = `<h2 style="margin-top:0">${esc(maiuscula(dt.toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long'})))}</h2><p class="lead">${Math.min(10, d.itens.length)} pautas principais${d.itens.length > 10 ? ' + ' + (d.itens.length - 10) + ' de reserva' : ''}, escolhidas entre ${fmtNum(d.candidatos)} notícias · ${esc(d.modelo)}</p>${listaPautas(d.itens, false)}`;
}
// ---------------------------------------------------------------- navegacao (#pagina/aba)
function menu(atual) {
  const qn = quentesNovos().length;
  const link = ([id, p]) => `<a href="#${id}" ${id === atual ? 'aria-current="page"' : ''}>${ico(p.icone)}<span class="rot">${p.rotulo}</span>${id === 'hoje' && qn ? `<span class="cont" title="assuntos quentes novos">${qn}</span>` : ''}</a>`;
  const e = Object.entries(PAGINAS);
  document.getElementById('menu').innerHTML = e.filter(([, p]) => !p.rodape && !p.oculta).map(link).join('') + `<div class="rodape">${e.filter(([, p]) => p.rodape).map(link).join('')}</div>`;
}
function render() {
  if (!D) return;  // o endereco pode mudar antes de os dados chegarem
  let [pag, aba] = location.hash.replace('#', '').split('/');
  if (!PAGINAS[pag]) pag = 'hoje';
  // sem canal escolhido, tudo comeca pela tela de canais
  if (!canal()) pag = 'canais';
  // tela de canais = pagina inteira, sem topo e sem menu, como uma tela de entrada
  document.body.classList.toggle('tela-inicio', pag === 'canais');
  chip();
  const P = PAGINAS[pag]; menu(pag === 'todas' ? 'hoje' : pag);
  const c = canal();
  let html;
  if (pag === 'concorrentes' && !c.compara_concorrentes) html = `<h1>Concorrentes</h1>${soSardinha('A comparação com os concorrentes')}`;
  else if (pag === 'historico' && !c.pautas_diarias) html = `<h1>Histórico</h1>${soSardinha('O histórico de pautas')}`;
  else if (P.abas) {
    // aba 'titulos' (analise de titulos) so existe para o canal das pautas diarias
    const ids = Object.keys(P.abas).filter(a => !(a === 'titulos' && !c.pautas_diarias)); if (!ids.includes(aba)) aba = ids[0];
    const SUB = {concorrentes: 'O que está rendendo nos canais monitorados pelo Evander e como o nosso canal se compara.', nosso: `O que os dados mostram sobre o ${esc(c.nome)}.`};
    html = `<h1>${pag === 'nosso' ? esc(c.nome) : P.rotulo}</h1><p class="lead">${SUB[pag] || ''}</p><div class="abas" role="tablist">${ids.map(a => `<button role="tab" aria-selected="${a === aba}" data-aba="#${pag}/${a}">${P.abas[a][0]}</button>`).join('')}</div>${P.abas[aba][1]()}`;
  } else html = P.desenhar();
  const m = document.getElementById('conteudo'); m.innerHTML = html; window.scrollTo(0, 0);
  if (P.depois) P.depois(aba);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-aba]'); if (b) { location.hash = b.dataset.aba; return; }
  if (e.target.closest('#canal-chip')) { document.getElementById('opcoes').hidden ? abrirSeletor() : fecharSeletor(); return; }
  const tr = e.target.closest('[data-trocar]'); if (tr) { gravarCanal(tr.dataset.trocar); render(); return; }
  if (!e.target.closest('#seletor')) fecharSeletor();
  const ec = e.target.closest('[data-canal]'); if (ec) { gravarCanal(ec.dataset.canal); if (location.hash === '#hoje') render(); else location.hash = 'hoje'; return; }
  const vm = e.target.closest('[data-vermais]'); if (vm) { const l = vm.parentElement.previousElementSibling; l.hidden = false; vm.parentElement.remove(); return; }
  const dd = e.target.closest('[data-dia]'); if (dd) { history.replaceState(null, '', '#historico/' + dd.dataset.dia); desenharCal(dd.dataset.dia, Object.keys(H).sort()); desenharDia(dd.dataset.dia); return; }
  const mm = e.target.closest('[data-mes]'); if (mm) { mesCal = new Date(mesCal.getFullYear(), mesCal.getMonth() + Number(mm.dataset.mes), 1); desenharCal((location.hash.split('/')[1]) || '', Object.keys(H).sort()); return; }
  const a = e.target.closest('[data-explica]'); if (a) { const p = document.getElementById(a.dataset.explica); const ab = p.classList.toggle('aberto'); a.setAttribute('aria-expanded', ab); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharSeletor(); });
document.addEventListener('input', e => { if (e.target.id === 'busca') desenharTodas(e.target.value); });
window.addEventListener('hashchange', render);
fetch('dados.json', {cache: 'no-store'}).then(r => r.json()).then(d => { D = d; document.getElementById('quando').textContent = fmtDataHora(d.gerado_em); render(); })
  .catch(() => { document.getElementById('conteudo').innerHTML = '<div class="card vazio">Não consegui carregar os dados.</div>'; });
</script>
</body>
